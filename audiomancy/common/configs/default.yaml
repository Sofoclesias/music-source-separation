exp:
  name: 'audiomancer0_1'
  ver: 'v0.1'
  out_path: 

# Si nada en out_path, por defecto los modelos y el log será 
# en outputs/ del repositorio. Si lo corres en Google Colab, 
# especificar la ruta exacta considerando:
#
# from google.colab import drive
# drive.mount('/content/drive')

dset:
  jams: 200
  samplerate: 44100
  segment: 1
  shift: 1
  training_split: '70/15/15'
  channels: 1
  full_cv: 2
  normalize: true
  train_valid: true
  sources: ['bass','brass','drums','guitar','piano','vocals']

test:
  split: True
  best: True
  every: 20
  shifts: 1
  overlap: 0.25
  workers: 1
  sdr: True
  metric: 'nsdr'

epochs: 150
batch_size: 32

optim:
  lr: 3e-4
  momentum: 0.9
  beta2: 0.99
  loss: l1
  optim: adam
  weight_decay: 0
  clip_grad: 0

seed: 42
weights: [1., 1., 1., 1., 1., 1.]
max_batches: 
valid_apply: true

misc:
  num_workers: 0
  num_prints: 4
  show: False
  verbose: False

audiomancy:
  use_train_segment: true
  # Channels
  channels: 48
  channels_time:
  growth: 2
  # STFT
  nfft: 4096
  wiener_iters: 0
  end_iters: 0
  wiener_residual: false
  cac: true
  # Main structure
  depth: 4
  rewrite: true
  # Frequency Branch
  multi_freqs: []
  multi_freqs_depth: 3
  freq_emb: 0.2
  emb_scale: 10
  emb_smooth: true
  # Convolutions
  kernel_size: 8
  stride: 4
  time_stride: 2
  context: 1
  context_enc: 0
  # normalization
  norm_starts: 4
  norm_groups: 4
  # DConv residual branch
  dconv_mode: 1
  dconv_depth: 2
  dconv_comp: 8
  dconv_init: 1e-3
  # Before the Transformer
  bottom_channels: 0
  # CrossTransformer
  # ------ Common to all
  # Regular parameters
  t_layers: 5
  t_hidden_scale: 4.0
  t_heads: 8
  t_dropout: 0.0
  t_layer_scale: True
  t_gelu: True
  # ------------- Positional Embedding
  t_emb: sin
  t_max_positions: 10000 # for the scaled embedding
  t_max_period: 10000.0
  t_weight_pos_embed: 1.0
  t_cape_mean_normalize: True
  t_cape_augment: True
  t_cape_glob_loc_scale: [5000.0, 1.0, 1.4]
  t_sin_random_shift: 0
  # ------------- norm before a transformer encoder
  t_norm_in: True
  t_norm_in_group: False
  # ------------- norm inside the encoder
  t_group_norm: False
  t_norm_first: True
  t_norm_out: True
  # ------------- optim
  t_weight_decay: 0.0
  t_lr:
  # ------------- sparsity
  t_sparse_self_attn: False
  t_sparse_cross_attn: False
  t_mask_type: diag
  t_mask_random_seed: 42
  t_sparse_attn_window: 400
  t_global_window: 100
  t_sparsity: 0.95
  t_auto_sparsity: False
  # Cross Encoder First (False)
  t_cross_first: False
  # Weight init
  rescale: 0.1
