name: Docker Image CI for GHCR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build and push the image
        run: |
          docker login --username sofoclesias --password ${{ secrets.GH_PAT}} ghcr.io
          docker build --target train -t ghcr.io/sofoclesias/train-gc:latest .
          docker build --target stream -t ghcr.io/sofoclesias/audiomancy:latest .
          docker push ghcr.io/sofoclesias/train-gc:latest         
          docker push ghcr.io/sofoclesias/audiomancy:latest